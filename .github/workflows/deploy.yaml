name: Manual Deploy to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the image (e.g., v1.0.0)"
        required: true
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        env:
          TAG: ${{ github.event.inputs.tag }}
          IMAGE: myusername/myfastapi
        run: |
          echo "Building image with tag: $TAG"
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Setup ssh
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to production server
        if: success()
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_ADDRESS "
            docker pull username/het_uz_telegram_bot:$TAG &&
            IMAGE_TAG=$TAG docker-compose -f /bot/docker-compose.prod.yaml up -d
          "
