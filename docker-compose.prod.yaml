version: "3.8"

services:
  web:
    build:
      dockerfile: Dockerfile.production
    volumes:
      - .:/home/user/bot
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5445:5432"

volumes:
  postgres_data:
