version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.development
    command: python -m src.bot_polling
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - app_network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - app_network

  db:
    image: postgres:14
    volumes:
      - postgres_polling_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: het_db
    ports:
      - "5445:5432"
    networks:
      - app_network

volumes:
  postgres_polling_data:

networks:
  app_network:
    driver: bridge
