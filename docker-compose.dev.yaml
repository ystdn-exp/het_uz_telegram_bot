version: "3.8"

services:
  web:
    build: .
    volumes:
      - .:/home/user/het
    env_file:
      - .env
    depends_on:
      - redis
      - db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: het
      POSTGRES_PASSWORD: het
      POSTGRES_DB: het
    ports:
      - "5445:5432"

volumes:
  postgres_data:
